const MARTIN_TARGET = { kcalMin: 1800, kcalMax: 2000, pMin: 130, pMax: 145 };
const MEAL_LABELS = { breakfast:"🌅 Snídaně", snack1:"🍎 Svač. 1", lunch:"☀️ Oběd", snack2:"🍎 Svač. 2", dinner:"🌙 Večeře" };
const MEAL_KEYS = ["breakfast","snack1","lunch","snack2","dinner"];
const CAT_EMOJI = { "snídaně":"🌅", "svačina":"🍎", "oběd":"☀️", "večeře":"🌙" };
const CAT_ORDER = ["snídaně","svačina","oběd","večeře"];

// ─────────────────────────────────────────────────────────────────────────
// STATE (persisted in localStorage)
// ─────────────────────────────────────────────────────────────────────────
function loadState() {
  try {
    const raw = localStorage.getItem("jidelnicek_state");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { tab: "plan", planWeek: 0, shopWeek: 0, checked: {} };
}
function saveState() {
  try { localStorage.setItem("jidelnicek_state", JSON.stringify(state)); } catch (e) {}
}
let state = loadState();

// ─────────────────────────────────────────────────────────────────────────
// RENDER HELPERS
// ─────────────────────────────────────────────────────────────────────────
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function dayTotals(day) {
  let mP=0,mK=0,wP=0,wK=0;
  MEAL_KEYS.forEach(mk => {
    const key = day[mk];
    if (!key || !RECIPES[key]) return;
    const r = RECIPES[key];
    mP += r.martinMacros.p; mK += r.martinMacros.kcal;
    wP += r.wifeMacros.p; wK += r.wifeMacros.kcal;
  });
  return { mP, mK, wP, wK };
}

function renderPlan() {
  const week = WEEKS[state.planWeek];
  let html = '<div class="week-pills">';
  WEEKS.forEach((w,i) => {
    html += `<button class="pill ${i===state.planWeek?'active':''}" data-week="${i}">${esc(w.label)}</button>`;
  });
  html += '</div>';
  html += `<div class="info-box">🟢 Zelená = v cíli &nbsp;|&nbsp; 🔴 Červená = mimo cíl &nbsp;|&nbsp; ${esc(week.note)}</div>`;

  week.days.forEach(day => {
    const isWeekend = day.label === "So" || day.label === "Ne";
    const t = dayTotals(day);
    const mKok = t.mK >= MARTIN_TARGET.kcalMin && t.mK <= MARTIN_TARGET.kcalMax;
    const mPok = t.mP >= MARTIN_TARGET.pMin && t.mP <= MARTIN_TARGET.pMax;
    html += `<div class="day-card"><div class="day-head ${isWeekend?'weekend':''}">
      <div><span class="label">${esc(day.label)}</span>
      <div class="day-macros">
        <span style="color:${mKok?'#16a34a':'#dc2626'};font-weight:700;">M: ${t.mK} kcal</span>
        <span style="color:${mPok?'#16a34a':'#dc2626'};font-weight:700;">${t.mP}g B</span>
        <span style="color:#9333ea;font-weight:600;">Ž: ${t.wK} kcal / ${t.wP}g B</span>
      </div></div>
    </div><div class="day-body">`;
    MEAL_KEYS.forEach((mk,mi) => {
      const key = day[mk];
      html += `<div class="meal-row"><span class="meal-label">${MEAL_LABELS[mk]}</span>`;
      if (key === null) html += `<span class="meal-note">🍴 Restaurace</span>`;
      else if (key === "ORDER") html += `<span class="meal-note order">📦 Objednáno (mimo evidenci)</span>`;
      else if (key === undefined) html += `<span class="meal-note">— vynecháno</span>`;
      else html += `<button class="meal-btn" data-recipe="${key}">${esc(RECIPES[key].name)}</button>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

function renderRecipes() {
  const byCat = {};
  Object.entries(RECIPES).forEach(([key,r]) => {
    if (!byCat[r.category]) byCat[r.category] = [];
    byCat[r.category].push({key, ...r});
  });
  let html = "";
  CAT_ORDER.forEach(cat => {
    const list = byCat[cat] || [];
    if (!list.length) return;
    html += `<h2 class="cat-title">${CAT_EMOJI[cat]} ${cat.charAt(0).toUpperCase()+cat.slice(1)}</h2>`;
    list.forEach(r => {
      html += `<div class="recipe-card" data-recipe="${r.key}">
        <div class="top"><div><div class="name">${esc(r.name)}</div><div class="desc">${esc(r.desc)}</div></div><span class="chev">›</span></div>
        <div class="badge-row">
          <span class="badge-m">M: ${r.martinMacros.kcal} kcal · ${r.martinMacros.p}g B</span>
          <span class="badge-z">Ž: ${r.wifeMacros.kcal} kcal · ${r.wifeMacros.p}g B</span>
        </div></div>`;
    });
  });
  return html;
}

function renderShopping() {
  const week = SHOPPING_WEEKS[state.shopWeek];
  let html = '<div class="week-pills">';
  SHOPPING_WEEKS.forEach((w,i) => {
    html += `<button class="pill ${i===state.shopWeek?'active':''}" data-shopweek="${i}">${esc(w.label)}</button>`;
  });
  html += '</div>';
  html += `<div class="info-box">💡 ${esc(week.sub)} · každá potravina je na samostatném řádku</div>`;
  Object.entries(week.categories).forEach(([cat, items]) => {
    html += `<div class="shop-cat"><div class="shop-cat-head">${esc(cat)}</div><div class="shop-cat-body">`;
    items.forEach((item, i) => {
      const k = `${state.shopWeek}|${cat}|${i}`;
      const on = !!state.checked[k];
      html += `<div class="shop-item" data-key="${k}">
        <div class="shop-check ${on?'on':''}">${on?'✓':''}</div>
        <span class="shop-text ${on?'on':''}">${esc(item)}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

function macroBadges(m) {
  return `<span class="macro-badge" style="background:#065f46;">kcal: ${m.kcal}</span>
    <span class="macro-badge" style="background:#16a34a;">B: ${m.p}g</span>
    <span class="macro-badge" style="background:#d97706;">T: ${m.f}g</span>
    <span class="macro-badge" style="background:#7c3aed;">S: ${m.c}g</span>`;
}

function openModal(key) {
  const r = RECIPES[key];
  if (!r) return;
  const box = document.getElementById("modalBox");
  box.innerHTML = `
    <div class="modal-head"><h2>${esc(r.name)}</h2><button class="modal-close" id="modalCloseBtn">✕</button></div>
    <p class="modal-desc">${esc(r.desc)}</p>
    <div class="macro-cols">
      <div class="macro-col" style="background:#f0fdf4;"><div class="who" style="color:#065f46;">🧑 Martin</div>${macroBadges(r.martinMacros)}</div>
      <div class="macro-col" style="background:#fdf4ff;"><div class="who" style="color:#9333ea;">👩 Manželka</div>${macroBadges(r.wifeMacros)}</div>
    </div>
    <h4>🛒 Porce</h4>
    <ul>${r.ingredients.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h4>👨‍🍳 Postup</h4>
    <ol>${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    ${r.note ? `<div class="modal-note">💡 ${esc(r.note)}</div>` : ""}
  `;
  document.getElementById("modalOverlay").classList.add("open");
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
}
function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }

// ─────────────────────────────────────────────────────────────────────────
// MAIN RENDER + EVENTS
// ─────────────────────────────────────────────────────────────────────────
function render() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
  });
  const content = document.getElementById("content");
  if (state.tab === "plan") content.innerHTML = renderPlan();
  else if (state.tab === "recipes") content.innerHTML = renderRecipes();
  else content.innerHTML = renderShopping();
  attachContentEvents();
}

function attachContentEvents() {
  document.querySelectorAll("[data-week]").forEach(el => {
    el.addEventListener("click", () => { state.planWeek = parseInt(el.dataset.week,10); saveState(); render(); });
  });
  document.querySelectorAll("[data-shopweek]").forEach(el => {
    el.addEventListener("click", () => { state.shopWeek = parseInt(el.dataset.shopweek,10); saveState(); render(); });
  });
  document.querySelectorAll("[data-recipe]").forEach(el => {
    el.addEventListener("click", () => openModal(el.dataset.recipe));
  });
  document.querySelectorAll(".shop-item").forEach(el => {
    el.addEventListener("click", () => {
      const k = el.dataset.key;
      state.checked[k] = !state.checked[k];
      saveState();
      render();
    });
  });
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => { state.tab = btn.dataset.tab; saveState(); render(); });
});
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});

render();
</script>
</body>
</html>
