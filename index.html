const DAYS = ["Pondělí", "Úterý", "Středa", "Čtvrtek", "Pátek", "Sobota", "Neděle"];
const MEAL_TYPES = ["breakfast", "lunch", "snack", "dinner"];
const MEAL_LABELS = { breakfast: "🌅 Snídaně", lunch: "☀️ Oběd", snack: "🍎 Svačina", dinner: "🌙 Večeře" };

// ── HELPERS ───────────────────────────────────────────────────────────
function MacroBadge({ label, value, color }) {
  return (
    <span style={{
      display: "inline-block", padding: "2px 8px", borderRadius: 12,
      fontSize: 12, fontWeight: 600, background: color, color: "#fff", marginRight: 4,
    }}>
      {label}: {value}
    </span>
  );
}

function RecipeModal({ recipeKey, onClose }) {
  const r = RECIPES[recipeKey];
  if (!r) return null;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, maxWidth: 560, width: "100%", maxHeight: "88vh", overflowY: "auto", boxShadow: "0 8px 40px rgba(0,0,0,0.18)" }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <h2 style={{ margin: 0, fontSize: 20, color: "#1a1a1a" }}>{r.name}</h2>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 22, cursor: "pointer", color: "#888" }}>✕</button>
        </div>
        <p style={{ color: "#666", marginTop: 6, marginBottom: 14 }}>{r.desc}</p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
          <div style={{ flex: 1, minWidth: 200, background: "#f0fdf4", borderRadius: 10, padding: "10px 14px" }}>
            <div style={{ fontWeight: 700, fontSize: 13, color: "#065f46", marginBottom: 4 }}>🧑 Martin</div>
            <MacroBadge label="kcal" value={r.martinMacros.kcal} color="#065f46" />
            <MacroBadge label="B" value={r.martinMacros.p + "g"} color="#16a34a" />
            <MacroBadge label="T" value={r.martinMacros.f + "g"} color="#d97706" />
            <MacroBadge label="S" value={r.martinMacros.c + "g"} color="#7c3aed" />
          </div>
          <div style={{ flex: 1, minWidth: 200, background: "#fdf4ff", borderRadius: 10, padding: "10px 14px" }}>
            <div style={{ fontWeight: 700, fontSize: 13, color: "#9333ea", marginBottom: 4 }}>👩 Manželka</div>
            <MacroBadge label="kcal" value={r.wifeMacros.kcal} color="#9333ea" />
            <MacroBadge label="B" value={r.wifeMacros.p + "g"} color="#16a34a" />
            <MacroBadge label="T" value={r.wifeMacros.f + "g"} color="#d97706" />
            <MacroBadge label="S" value={r.wifeMacros.c + "g"} color="#7c3aed" />
          </div>
        </div>
        <h4 style={{ margin: "0 0 8px", color: "#374151" }}>🛒 Ingredience</h4>
        <ul style={{ margin: "0 0 16px", paddingLeft: 20, color: "#374151" }}>
          {r.ingredients.map((ing, i) => <li key={i} style={{ marginBottom: 4, fontSize: 14 }}>{ing}</li>)}
        </ul>
        <h4 style={{ margin: "0 0 8px", color: "#374151" }}>👨‍🍳 Postup</h4>
        <ol style={{ margin: "0 0 14px", paddingLeft: 20, color: "#374151" }}>
          {r.steps.map((s, i) => <li key={i} style={{ marginBottom: 6, fontSize: 14 }}>{s}</li>)}
        </ol>
        {r.note && (
          <div style={{ background: "#fefce8", borderLeft: "4px solid #eab308", borderRadius: 8, padding: "10px 14px", fontSize: 13, color: "#713f12" }}>
            💡 {r.note}
          </div>
        )}
      </div>
    </div>
  );
}

function DayMacros({ meals }) {
  let mP = 0, mK = 0, wP = 0, wK = 0;
  Object.values(meals).forEach(key => {
    if (!key || !RECIPES[key]) return;
    const r = RECIPES[key];
    mP += r.martinMacros.p; mK += r.martinMacros.kcal;
    wP += r.wifeMacros.p; wK += r.wifeMacros.kcal;
  });
  return (
    <div style={{ fontSize: 11, marginTop: 6, display: "flex", gap: 8, flexWrap: "wrap" }}>
      <span style={{ color: "#16a34a", fontWeight: 700 }}>M: {mK} kcal, {mP}g B</span>
      <span style={{ color: "#9333ea", fontWeight: 600 }}>Ž: {wK} kcal, {wP}g B</span>
    </div>
  );
}

function MealSelector({ dayIndex, mealType, selectedRecipe, onSelect }) {
  const [showPicker, setShowPicker] = useState(false);
  const recipes = Object.entries(RECIPES).filter(([_, r]) => r.category === (mealType === "snack" ? "svačina" : mealType === "breakfast" ? "snídaně" : mealType === "lunch" ? "oběd" : "večeře"));
  
  return (
    <div style={{ marginBottom: 12 }}>
      <button onClick={() => setShowPicker(!showPicker)} style={{
        width: "100%", textAlign: "left", padding: "10px 12px", border: "1px solid #e2e8f0",
        borderRadius: 8, background: selectedRecipe ? "#f0fdf4" : "#fff", cursor: "pointer",
        fontSize: 13, fontWeight: 500, color: "#374151"
      }}>
        {selectedRecipe ? (RECIPES[selectedRecipe]?.name || "Vybrat recept") : `${MEAL_LABELS[mealType]} - Vybrat recept`}
      </button>
      {showPicker && (
        <div style={{ marginTop: 4, background: "#fff", border: "1px solid #e2e8f0", borderRadius: 8, overflow: "hidden", zIndex: 10, position: "relative" }}>
          {recipes.map(([key, r]) => (
            <button key={key} onClick={() => { onSelect(key); setShowPicker(false); }} style={{
              width: "100%", textAlign: "left", padding: "10px 12px", border: "none",
              borderBottom: "1px solid #f1f5f9", background: selectedRecipe === key ? "#ecfdf5" : "#fff",
              cursor: "pointer", fontSize: 13, color: "#374151"
            }}>
              <div style={{ fontWeight: 500 }}>{r.name}</div>
              <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 2 }}>M: {r.martinMacros.kcal} kcal · Ž: {r.wifeMacros.kcal} kcal</div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [mealPlan, setMealPlan] = useState(() => {
    try {
      const saved = localStorage.getItem("mealPlan");
      return saved ? JSON.parse(saved) : Array(7).fill(null).map(() => ({
        breakfast: null, lunch: null, snack: null, dinner: null
      }));
    } catch {
      return Array(7).fill(null).map(() => ({
        breakfast: null, lunch: null, snack: null, dinner: null
      }));
    }
  });
  const [activeTab, setActiveTab] = useState("plan");
  const [openRecipe, setOpenRecipe] = useState(null);
  const [checked, setChecked] = useState({});

  useEffect(() => {
    localStorage.setItem("mealPlan", JSON.stringify(mealPlan));
  }, [mealPlan]);

  const toggleCheck = k => setChecked(p => ({ ...p, [k]: !p[k] }));

  const updateMeal = (dayIndex, mealType, recipeKey) => {
    const newPlan = [...mealPlan];
    newPlan[dayIndex] = { ...newPlan[dayIndex], [mealType]: recipeKey };
    setMealPlan(newPlan);
  };

  const aggregateIngredients = useMemo(() => {
    const ingredients = {};
    mealPlan.forEach(dayMeals => {
      Object.values(dayMeals).forEach(recipeKey => {
        if (!recipeKey || !RECIPES[recipeKey]) return;
        const recipe = RECIPES[recipeKey];
        recipe.ingredients.forEach(ing => {
          ingredients[ing] = (ingredients[ing] || 0) + 1;
        });
      });
    });
    return ingredients;
  }, [mealPlan]);

  const shoppingList = useMemo(() => {
    const grouped = {};
    Object.entries(aggregateIngredients).forEach(([ing, count]) => {
      const category = ing.includes("g") || ing.includes("ml") ? "🥩 Maso/ryby/vejce" :
                       ing.includes("chleb") || ing.includes("toast") || ing.includes("bagel") || ing.includes("tortilla") ? "🍞 Pečivo" :
                       ing.includes("mouka") || ing.includes("cornflakes") || ing.includes("ovoce") || ing.includes("bulgur") || ing.includes("rýž") || ing.includes("těstoviny") || ing.includes("čočka") || ing.includes("fazole") ? "🌾 Obiloviny/obilniny" :
                       "🥦 Ostatní";
      if (!grouped[category]) grouped[category] = [];
      grouped[category].push({ ingredient: ing, count });
    });
    return grouped;
  }, [aggregateIngredients]);

  const resetPlan = () => {
    setMealPlan(Array(7).fill(null).map(() => ({
      breakfast: null, lunch: null, snack: null, dinner: null
    })));
    setChecked({});
  };

  return (
    <div style={{ fontFamily: "'Inter','Segoe UI',sans-serif", minHeight: "100vh", background: "#f8fafc" }}>
      <div style={{ background: "linear-gradient(135deg,#065f46 0%,#0f766e 100%)", color: "#fff", padding: "20px 20px 0" }}>
        <h1 style={{ margin: "0 0 4px", fontSize: 22, fontWeight: 800 }}>🍽️ Konstruktor Jídelníčku</h1>
        <p style={{ margin: "0 0 16px", opacity: 0.8, fontSize: 13 }}>Vyber recepty pro každý den a vytvoř si svůj vlastní plán. Aplikace pak automaticky vygeneruje seznam nákupu.</p>
        <div style={{ display: "flex", gap: 4 }}>
          {[["plan", "📅 Plán"], ["recipes", "👨‍🍳 Recepty"], ["shopping", "🛒 Nákup"]].map(([t, label]) => (
            <button key={t} onClick={() => setActiveTab(t)} style={{
              padding: "8px 16px", borderRadius: "10px 10px 0 0", border: "none",
              fontWeight: 600, fontSize: 13, cursor: "pointer",
              background: activeTab === t ? "#fff" : "rgba(255,255,255,0.15)",
              color: activeTab === t ? "#065f46" : "#fff",
            }}>{label}</button>
          ))}
        </div>
      </div>

      <div style={{ padding: 16, maxWidth: 900, margin: "0 auto" }}>

        {activeTab === "plan" && (
          <>
            <div style={{ marginBottom: 16 }}>
              <button onClick={resetPlan} style={{
                padding: "8px 16px", borderRadius: 8, border: "1px solid #dc2626",
                background: "#fee2e2", color: "#dc2626", fontWeight: 600, cursor: "pointer", fontSize: 13
              }}>🗑️ Vymazat plán</button>
            </div>
            {DAYS.map((day, dayIndex) => (
              <div key={dayIndex} style={{ background: "#fff", borderRadius: 14, marginBottom: 12, boxShadow: "0 1px 4px rgba(0,0,0,0.07)", overflow: "hidden" }}>
                <div style={{
                  background: dayIndex >= 5 ? "#fef3c7" : "#f0fdf4",
                  padding: "12px 16px", borderBottom: "1px solid #f1f5f9",
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                }}>
                  <span style={{ fontWeight: 700, fontSize: 15, color: "#1e293b" }}>{day}</span>
                  <DayMacros meals={mealPlan[dayIndex]} />
                </div>
                <div style={{ padding: "16px" }}>
                  {MEAL_TYPES.map(mealType => (
                    <MealSelector key={mealType} dayIndex={dayIndex} mealType={mealType}
                      selectedRecipe={mealPlan[dayIndex][mealType]}
                      onSelect={key => updateMeal(dayIndex, mealType, key)} />
                  ))}
                </div>
              </div>
            ))}
          </>
        )}

        {activeTab === "recipes" && (
          <>
            {["snídaně", "oběd", "svačina", "večeře"].map(cat => {
              const recipes = Object.entries(RECIPES).filter(([_, r]) => r.category === cat);
              return (
                <div key={cat} style={{ marginBottom: 20 }}>
                  <h2 style={{ fontSize: 17, color: "#1e293b", margin: "0 0 10px" }}>
                    {cat === "snídaně" ? "🌅" : cat === "oběd" ? "☀️" : cat === "svačina" ? "🍎" : "🌙"} {cat.charAt(0).toUpperCase() + cat.slice(1)}
                  </h2>
                  {recipes.map(([key, r]) => (
                    <div key={key} onClick={() => setOpenRecipe(key)} style={{ background: "#fff", borderRadius: 12, marginBottom: 10, boxShadow: "0 1px 3px rgba(0,0,0,0.06)", padding: "14px 16px", cursor: "pointer" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div>
                          <div style={{ fontWeight: 600, color: "#1e293b", fontSize: 15 }}>{r.name}</div>
                          <div style={{ color: "#64748b", fontSize: 13, marginTop: 3 }}>{r.desc}</div>
                        </div>
                        <span style={{ color: "#94a3b8", fontSize: 20, marginLeft: 8 }}>›</span>
                      </div>
                      <div style={{ marginTop: 8, display: "flex", gap: 6, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 11, color: "#065f46", background: "#ecfdf5", borderRadius: 8, padding: "2px 8px", fontWeight: 600 }}>M: {r.martinMacros.kcal} kcal · {r.martinMacros.p}g B</span>
                        <span style={{ fontSize: 11, color: "#9333ea", background: "#faf5ff", borderRadius: 8, padding: "2px 8px", fontWeight: 600 }}>Ž: {r.wifeMacros.kcal} kcal · {r.wifeMacros.p}g B</span>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
          </>
        )}

        {activeTab === "shopping" && (
          <>
            <div style={{ background: "#ecfdf5", border: "1px solid #6ee7b7", borderRadius: 12, padding: "12px 16px", marginBottom: 16, fontSize: 13, color: "#065f46" }}>
              💡 Vytvořeno z {mealPlan.flat().filter(m => m).length} vybraných jídel. Počty ingrediencí = kolikrát se vyskytují v plánu.
            </div>
            {Object.entries(shoppingList).map(([cat, items]) => (
              <div key={cat} style={{ background: "#fff", borderRadius: 12, marginBottom: 12, boxShadow: "0 1px 3px rgba(0,0,0,0.06)", overflow: "hidden" }}>
                <div style={{ background: "#f8fafc", padding: "10px 16px", fontWeight: 700, fontSize: 14, color: "#1e293b", borderBottom: "1px solid #f1f5f9" }}>{cat}</div>
                <div style={{ padding: "8px 16px" }}>
                  {items.map((item, i) => {
                    const k = cat + item.ingredient;
                    return (
                      <div key={i} onClick={() => toggleCheck(k)} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "8px 0", borderBottom: i < items.length - 1 ? "1px solid #f1f5f9" : "none", cursor: "pointer" }}>
                        <div style={{ width: 20, height: 20, borderRadius: 6, border: "2px solid", borderColor: checked[k] ? "#065f46" : "#cbd5e1", background: checked[k] ? "#065f46" : "#fff", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                          {checked[k] && <span style={{ color: "#fff", fontSize: 12 }}>✓</span>}
                        </div>
                        <div style={{ fontSize: 14, color: "#374151", textDecoration: checked[k] ? "line-through" : "none", opacity: checked[k] ? 0.5 : 1, flex: 1 }}>
                          {item.ingredient}
                          {item.count > 1 && <span style={{ fontSize: 11, color: "#94a3b8", marginLeft: 6 }}>({item.count}x)</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
            {Object.keys(shoppingList).length === 0 && (
              <div style={{ background: "#fff", borderRadius: 12, padding: 20, textAlign: "center", color: "#94a3b8" }}>
                Vyberi recepty v plánu a seznam nákupu se automaticky vygeneruje.
              </div>
            )}
          </>
        )}
      </div>
      {openRecipe && <RecipeModal recipeKey={openRecipe} onClose={() => setOpenRecipe(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
